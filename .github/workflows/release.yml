name: Publish to Modrinth & CurseForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Release type (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

jobs:
  build:
    name: Build All Targets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep 'mod.version' stonecutter.properties.toml | head -n 1 | cut -d '"' -f 2)
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Resolved Mod Version: $VER"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew buildAll --no-daemon --console=plain

      # 1.12.2 / 1.10.2(Forge) 走独立子构建: Unimined 与 Loom 的 tiny-remapper 版本互斥,
      # 不能共处一个插件类路径。它们消费上一步生成的 Stonecutter 产物, 并把 jar 复制进 build/libs/<version>/。
      - name: Build legacy Forge targets (legacy sub-build)
        run: |
          ./gradlew -p legacy-forge buildAndCollect "-Pmc=1.12.2" --no-daemon --console=plain
          ./gradlew -p legacy-forge buildAndCollect "-Pmc=1.10.2" --no-daemon --console=plain
          ./gradlew -p legacy-forge buildAndCollect "-Pmc=1.8.9" --no-daemon --console=plain
          ./gradlew -p legacy-forge buildAndCollect "-Pmc=1.7.10" --no-daemon --console=plain
          ./gradlew -p legacy-forge buildAndCollect "-Pmc=1.9.4" --no-daemon --console=plain
          ./gradlew -p legacy-forge buildAndCollect "-Pmc=1.11.2" --no-daemon --console=plain

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reflex-jars
          path: build/libs/${{ steps.get_version.outputs.version }}/*.jar
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "Reflex v${{ steps.get_version.outputs.version }}"
          tag_name: "${{ github.ref_name }}"
          files: build/libs/${{ steps.get_version.outputs.version }}/*.jar
          generate_release_notes: true

  publish:
    name: Publish ${{ matrix.loader_name }} ${{ matrix.display_version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.21.11"
            display_version: "1.21.5 - 1.21.11"
            game_versions: |
              1.21.5
              1.21.6
              1.21.7
              1.21.8
              1.21.9
              1.21.10
              1.21.11
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "1.21.11"
            display_version: "1.21.5 - 1.21.11"
            game_versions: |
              1.21.5
              1.21.6
              1.21.7
              1.21.8
              1.21.9
              1.21.10
              1.21.11
          - loader: "fabric"
            loader_name: "Fabric"
            target: "26.1.2"
            display_version: "26.1 - 26.1.2"
            game_versions: |
              26.1
              26.1.1
              26.1.2
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "26.1.2"
            display_version: "26.1 - 26.1.2"
            game_versions: |
              26.1
              26.1.1
              26.1.2
          - loader: "fabric"
            loader_name: "Fabric"
            target: "26.2"
            display_version: "26.2"
            game_versions: |
              26.2
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "26.2"
            display_version: "26.2"
            game_versions: |
              26.2
          - loader: "fabric"
            loader_name: "Fabric"
            target: "26.3"
            display_version: "26.3+"
            game_versions: |
              26.3
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "26.3"
            display_version: "26.3+"
            game_versions: |
              26.3
          # ==== 向下补齐的兼容组: 一个兼容组只出一个代表版本 ====
          # 1.21.2 起 Window#updateDisplay 收 TracyFrameCapture 形参, 故 1.21~1.21.1 与 1.21.2~1.21.4 分属两组
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.21.4"
            display_version: "1.21.2 - 1.21.4"
            game_versions: |
              1.21.2
              1.21.3
              1.21.4
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "1.21.4"
            display_version: "1.21.2 - 1.21.4"
            game_versions: |
              1.21.2
              1.21.3
              1.21.4
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.21.1"
            display_version: "1.21 - 1.21.1"
            game_versions: |
              1.21
              1.21.1
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "1.21.1"
            display_version: "1.21 - 1.21.1"
            game_versions: |
              1.21
              1.21.1
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.20.6"
            display_version: "1.20.5 - 1.20.6"
            game_versions: |
              1.20.5
              1.20.6
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "1.20.6"
            display_version: "1.20.5 - 1.20.6"
            game_versions: |
              1.20.5
              1.20.6
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.20.1"
            display_version: "1.20 - 1.20.4"
            game_versions: |
              1.20
              1.20.1
              1.20.2
              1.20.3
              1.20.4
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.19.4"
            display_version: "1.19 - 1.19.4"
            game_versions: |
              1.19
              1.19.1
              1.19.2
              1.19.3
              1.19.4
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.18.2"
            display_version: "1.18 - 1.18.2"
            game_versions: |
              1.18
              1.18.1
              1.18.2
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.17.1"
            display_version: "1.17 - 1.17.1"
            game_versions: |
              1.17
              1.17.1
          # 1.16.5 及更早: 只有 fabric, 且客户端跑在 Java 8 上
          # (1.14.4 那一版没有 ModMenu 集成: 当年的坐标 io.github.prospector 已不可达, 配置改 config/reflex.json)
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.16.5"
            display_version: "1.16 - 1.16.5"
            game_versions: |
              1.16
              1.16.1
              1.16.2
              1.16.3
              1.16.4
              1.16.5
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.15.2"
            display_version: "1.15 - 1.15.2"
            game_versions: |
              1.15
              1.15.1
              1.15.2
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.14.4"
            display_version: "1.14 - 1.14.4"
            game_versions: |
              1.14
              1.14.1
              1.14.2
              1.14.3
              1.14.4
          # 1.12.2 及更早: 只有 Forge(MCP 映射, 构建走 legacy-forge 子构建)
          # 说明: 1.13.x 有意缺席 —— 它没有 Fabric; Forge 1.13.x 不自带 Mixin 且 MixinBootstrap 明确
          # 不支持 1.13.x(ModLauncher 版本原因); 唯一可行路线是 Rift, 但 CurseForge 不认 rift loader,
          # 只能上 Modrinth, 收益与代价不成比。需要时可单独补。
          - loader: "forge"
            loader_name: "Forge"
            target: "1.12.2"
            display_version: "1.12 - 1.12.2"
            game_versions: |
              1.12
              1.12.1
              1.12.2
          - loader: "forge"
            loader_name: "Forge"
            target: "1.10.2"
            display_version: "1.10 - 1.10.2"
            game_versions: |
              1.10
              1.10.1
              1.10.2
          - loader: "forge"
            loader_name: "Forge"
            target: "1.8.9"
            display_version: "1.8 - 1.8.9"
            game_versions: |
              1.8
              1.8.1
              1.8.2
              1.8.3
              1.8.4
              1.8.5
              1.8.6
              1.8.7
              1.8.8
              1.8.9
          - loader: "forge"
            loader_name: "Forge"
            target: "1.7.10"
            display_version: "1.7.10"
            game_versions: |
              1.7.10
          - loader: "forge"
            loader_name: "Forge"
            target: "1.9.4"
            display_version: "1.9 - 1.9.4"
            game_versions: |
              1.9
              1.9.1
              1.9.2
              1.9.3
              1.9.4
          - loader: "forge"
            loader_name: "Forge"
            target: "1.11.2"
            display_version: "1.11 - 1.11.2"
            game_versions: |
              1.11
              1.11.1
              1.11.2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: reflex-jars
          path: build/libs/${{ needs.build.outputs.version }}

      # 「之前已经发过了的版本不要重复发布」: 同一个 version_number 若在 Modrinth 上已存在,
      # 本条目整条跳过(CurseForge 一并跳过, 免得两边留下内容相同的重复条目)。
      # 接口异常时保守放行 —— 宁可让 mc-publish 去报重复, 也不要静默漏发。
      - name: Skip when this exact version already exists
        id: dup
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
          VERSION_NUMBER: "${{ needs.build.outputs.version }}+${{ matrix.loader }}-${{ matrix.target }}"
        run: |
          if [ -z "${MODRINTH_ID}" ]; then
            echo "未配置 Modrinth 项目 ID, 不做重复检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(curl -sS --max-time 30 -H 'User-Agent: reflex-release-ci' \
            "https://api.modrinth.com/v2/project/${MODRINTH_ID}/version" || echo '')
          if printf '%s' "$body" | grep -qF "\"version_number\":\"${VERSION_NUMBER}\""; then
            echo "${VERSION_NUMBER} 已发布过, 跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "${VERSION_NUMBER} 未发布过, 继续"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Modrinth & CurseForge
        if: steps.dup.outputs.skip != 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth (Project ID / Slug & Token)
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # CurseForge (Numeric Project ID & Token)
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Target Files & Loaders
          files: |
            build/libs/${{ needs.build.outputs.version }}/reflex-${{ matrix.loader }}-*+${{ matrix.target }}.jar
            !build/libs/**/*-sources.jar

          name: "Reflex ${{ needs.build.outputs.version }} [${{ matrix.loader_name }} ${{ matrix.display_version }}]"
          version: "${{ needs.build.outputs.version }}+${{ matrix.loader }}-${{ matrix.target }}"
          version-type: "${{ inputs.version_type || 'release' }}"

          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}

          dependencies: |
            cloth-config(required)