plugins {
    id 'dev.architectury.loom-no-remap' version '1.14.473' apply false
    id 'architectury-plugin' version '3.5.166'
    id 'com.gradleup.shadow' version "9.4.3" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }

        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
    }

    java {
        withSourcesJar()
    }
}
