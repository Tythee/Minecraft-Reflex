name: Publish to Modrinth & CurseForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Release type (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

jobs:
  build:
    name: Build All Targets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep 'mod.version' stonecutter.properties.toml | head -n 1 | cut -d '"' -f 2)
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Resolved Mod Version: $VER"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew buildAll --no-daemon --console=plain

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reflex-jars
          path: build/libs/${{ steps.get_version.outputs.version }}/*.jar
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "Reflex v${{ steps.get_version.outputs.version }}"
          tag_name: "${{ github.ref_name }}"
          files: build/libs/${{ steps.get_version.outputs.version }}/*.jar
          generate_release_notes: true

  publish:
    name: Publish ${{ matrix.loader_name }} ${{ matrix.display_version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: "fabric"
            loader_name: "Fabric"
            target: "1.21.11"
            display_version: "1.21.5 - 1.21.11"
            game_versions: |
              1.21.5
              1.21.6
              1.21.7
              1.21.8
              1.21.9
              1.21.10
              1.21.11
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "1.21.11"
            display_version: "1.21.5 - 1.21.11"
            game_versions: |
              1.21.5
              1.21.6
              1.21.7
              1.21.8
              1.21.9
              1.21.10
              1.21.11
          - loader: "fabric"
            loader_name: "Fabric"
            target: "26.1.2"
            display_version: "26.1 - 26.1.2"
            game_versions: |
              26.1
              26.1.1
              26.1.2
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "26.1.2"
            display_version: "26.1 - 26.1.2"
            game_versions: |
              26.1
              26.1.1
              26.1.2
          - loader: "fabric"
            loader_name: "Fabric"
            target: "26.2"
            display_version: "26.2+"
            game_versions: |
              26.2
          - loader: "neoforge"
            loader_name: "NeoForge"
            target: "26.2"
            display_version: "26.2+"
            game_versions: |
              26.2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: reflex-jars
          path: build/libs/${{ needs.build.outputs.version }}

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Modrinth (Project ID / Slug & Token)
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # CurseForge (Numeric Project ID & Token)
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Target Files & Loaders
          files: |
            build/libs/${{ needs.build.outputs.version }}/reflex-${{ matrix.loader }}-*+${{ matrix.target }}.jar
            !build/libs/**/*-sources.jar

          name: "Reflex ${{ needs.build.outputs.version }} [${{ matrix.loader_name }} ${{ matrix.display_version }}]"
          version: "${{ needs.build.outputs.version }}+${{ matrix.loader }}-${{ matrix.target }}"
          version-type: "${{ inputs.version_type || 'release' }}"

          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}

          dependencies: |
            cloth-config(required)